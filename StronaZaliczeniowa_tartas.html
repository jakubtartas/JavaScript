<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tartas 3F</title>
    <script>
        function otworzSrodek(url, nazwa, szerokosc, wysokosc) {
            const left = Math.round((screen.availWidth - szerokosc) / 2);
            const top = Math.round((screen.availHeight - wysokosc) / 2);
            window.open(url, nazwa, "toolbar=no,directories=no,menubar=no,height=" + wysokosc + ",width=" + szerokosc + ",top=" + top + ",left=" + left);
        }

        function WinOpen_z1() {
            otworzSrodek("Zad1/zadanie1_tart.html", "okienko_z1", 400, 300);
        }

        function WinOpen_z2() {
            otworzSrodek("Zad2/zadanie2_tart.html", "okienko_z2", 500, 500);
        }

        function WinOpen_z3() {
            otworzSrodek("Zad3/obraz.html", "okienko_z3", 490, 475);
        }

        function WinOpen_z4() {
            otworzSrodek("Zad4/zadanie4_tart.html", "okienko_z4", 500, 500);
        }

        function WinOpen_z5() {
            otworzSrodek("Zad5/zadanie5_tart.html", "okienko_z5", 600, 500);
        }

        function okno_zamknij() {
            window.close();
        }
    </script>
</head>
<body>
    <form>
        <font color="red"><h1 align="center">Szkielet zaliczeniowy JavaScript Jakub Tartas klasa 3F</h1></font>
        <div style="text-align: center; margin-top: 20px;">
        <input type="button" name="zadanie1" value="zadanie1-tartas" onclick="WinOpen_z1()">
        <input type="button" name="zadanie2" value="zadanie2-tartas" onclick="WinOpen_z2()">
        <input type="button" name="zadanie3" value="zadanie3-tartas" onclick="WinOpen_z3()">
        <input type="button" name="zadanie4" value="zadanie4-tartas" onclick="WinOpen_z4()">
        <input type="button" name="zadanie5" value="zadanie5-tartas" onclick="WinOpen_z5()">
        <input type="button" value="zamknij okno" onclick="okno_zamknij()">
        </div>
    </form>
</body>
</html>
