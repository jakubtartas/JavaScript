<html>

<head>
    <title>
        Przykład obliczenia P i obw prostokąta
    </title>
    <script language="JavaScript">
        function P_tar(a, b) {
            a_liczba = parseFloat(a)
            b_liczba = parseFloat(b)
            P_wynik = a_liczba * b_liczba
            document.getElementsByName('obj')[0].value = P_wynik.toFixed(2);
            alert("P=" + P_wynik.toFixed(2) + " cm^2");
            pokaz1.innerHTML = "P=" + P_wynik.toFixed(2) + " cm^2" + "<br>";

        }
        function Obw_tar(a, b) {
            a_liczba = parseFloat(a)
            b_liczba = parseFloat(b)
            Obw_wynik = 2 * a_liczba + 2 * b_liczba
            document.getElementsByName('pole')[0].value = Obw_wynik.toFixed(2);
            alert("Obw=" + Obw_wynik.toFixed(2) + " cm");
            pokaz2.innerHTML = "Obw=" + Obw_wynik.toFixed(2) + "cm";
        } 
    </script>
</head>

<body>
    Pobliczanie P i Obw prostokąta
    <br> <br>
    <form name="formularz" action="..." onsubmit="P_tar(this.a.value,this.b.value); 
Obw_tar(this.a.value,this.b.value);return false">
        Podaj a=
        <input size="6" name="a">
        Podaj b=
        <input size="6" name="b">
        <br> <br>
        <input TYPE="submit" Value="oblicz">
        <br> <br>
        P=
        <input size="6" name="obj" type="text" readonly>
        Obw=
        <input size="6" name="pole" type="text" readonly>
    </form>
    <table>
        <tr id="pokaz1"></tr>
        <tr id="pokaz2"></tr>
    </table>
</body>
</html>
