
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 9</title>
    <script type="text/javascript">
        function show_prompt() {
            var name = prompt("Wpisz swoje imię:", "");
            if (name != null && name != "") {
                document.write("Witaj " + name + "! Jak się masz?");
            }
        }
function okno_zamknij()
{
window.close()
}
    </script>
</head>
<body>
    <h2>Zastosowanie:</h2>
    <p>
        Jest używany wtedy, kiedy użytkownik ma wpisać coś, np. zanim wejdzie w dany moduł strony,
        np. hasło. Po wpisaniu wartości użytkownik może nacisnąć „OK” albo „Cancel”. Jeżeli kliknie „OK”,
        metoda zwraca wpisaną wartość, a w przeciwnym przypadku zwraca null.
    </p>
    <input type="button" onclick="show_prompt()" value="Pokaż prompt box" />
    <input type="button" value="zamknij okno" onclick="okno_zamknij()"/>
</body>
</html>
