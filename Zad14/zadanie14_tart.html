<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozkład ułamka egipskiego na trzy ułamki</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 20px;
            color: #ff0000;
            margin: 24px;
        }
    </style>
</head>
<body>
    <h1>Rozkład ułamka egipskiego na trzy ułamki egipskie</h1>
    <p>Podaj dodatnią liczbę naturalną m, aby rozłożyć 1/m na trzy ułamki egipskie.</p>

    <label for="liczba">m = </label>
    <input type="number" id="liczba" min="1" step="1">
    <input type="button" value="Oblicz" onclick="oblicz()">
    <p id="wynik" aria-live="polite"></p>

    <input type="button" value="zamknij okno" onclick="okno_zamknij_tartas()">

    <script>
        function oblicz() {
            var m = document.getElementById("liczba").valueAsNumber;
            var wynik = document.getElementById("wynik");

            if (!Number.isSafeInteger(m) || m <= 0) {
                wynik.textContent = "Podaj poprawną dodatnią liczbę naturalną.";
                return;
            }

            var mianownikPierwszy = m + 2;
            var mianownikDrugi = (m + 1) * (m + 2);
            var mianownikTrzeci = m * (m + 1);

            if (![mianownikPierwszy, mianownikDrugi, mianownikTrzeci].every(Number.isSafeInteger)) {
                wynik.textContent = "Podana liczba jest zbyt duża do obliczenia.";
                return;
            }

            wynik.textContent = "1/" + m + " = 1/" + mianownikPierwszy
                + " + 1/" + mianownikDrugi + " + 1/" + mianownikTrzeci;
        }

        function okno_zamknij_tartas() {
            window.close();
        }
    </script>
</body>
</html>
