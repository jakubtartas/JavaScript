<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozkład ułamka egipskiego</title>
</head>
<style>
    body {
        font-size: 30px;
        color: rgb(255, 0, 0);
    }
</style>
<body>
    <h1>Rozkład ułamka egipskiego na dwa ułamki egipskie</h1>

    <label for="liczba">Podaj dodatnią liczbę naturalną:</label>
    <input type="number" id="liczba" min="1" step="1">
    <input type="button" value="Oblicz" onclick="oblicz()">
    <p id="wynik" aria-live="polite"></p>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_tartas()">

    <script>
        function oblicz() {
            var m = document.getElementById("liczba").valueAsNumber;
            var wynik = document.getElementById("wynik");

            if (Number.isSafeInteger(m) && m > 0) {
                wynik.textContent = "1/" + m + " = 1/" + (m + 1) + " + 1/" + (m * (m + 1));
            } else {
                wynik.textContent = "Podaj poprawną dodatnią liczbę naturalną.";
            }
        }

        function okno_zamknij_tartas() {
            window.close();
        }
    </script>
</body>
</html>
